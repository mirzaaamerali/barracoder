<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barracoder — Season Board</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>">
<style>
:root{
    --paper:#0D1411; --card:#161F1A; --ink:#E3EDE5; --muted:#94A79A; --line:#26332B;
    --accent:#4CC98A; --accent-ink:#0B130E; --glow:#3ED2D8; --glow-soft:#12333A;
    --amber:#E2B267; --amber-soft:#33290F; --deep:#0A100C;
    --alert:#F0917A; --alert-soft:#3A1C15; --violet:#B9A3E8; --violet-soft:#241C38;
    --ph-core:#4CC98A; --ph-prep:#3ED2D8; --ph-scrim:#E88BB0; --ph-scrim-soft:#3A1626;
    --ph-improve:#B9A3E8; --ph-wrap:#E2B267;
    --shadow:0 8px 24px rgba(0,0,0,.35);
  }

*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink); line-height:1.5; font-size:15.5px;
  font-family:"Avenir Next",Avenir,Seravek,"Segoe UI",system-ui,sans-serif}
.wrap{max-width:1060px; margin:0 auto; padding:26px 18px 90px}
a{color:var(--glow)}
button{font:inherit; color:inherit; cursor:pointer}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums}
/* header */
.top{display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; margin-bottom:22px}
.eyebrow{font-size:11.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--accent); font-weight:700}
.biglogo{width:min(280px,55vw); height:auto; margin-top:2px}
.biglogo{filter:drop-shadow(0 0 18px rgba(255,255,255,.10))}
.visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
h1{font-family:Futura,"Avenir Next",system-ui,sans-serif; font-weight:700; font-size:clamp(26px,4.6vw,36px); margin:.1em 0 0; text-wrap:balance}
/* tabs */
.tabs{display:flex; gap:6px; border-bottom:2px solid var(--line); margin-bottom:20px}
.tab{background:none; border:none; border-bottom:3px solid transparent; margin-bottom:-2px;
  padding:9px 16px; font-size:15px; font-weight:700; color:var(--muted); border-radius:8px 8px 0 0}
.tab:hover{color:var(--ink); background:var(--deep)}
.tab.on{color:var(--accent); border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.askbar{display:flex; gap:8px; margin:-4px 0 20px}
.askbar input{flex:1; min-width:0; background:var(--card); color:var(--ink); border:1px solid var(--line);
  border-radius:99px; padding:9px 16px; font:inherit; font-size:14px}
.askbar input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.askgo{background:var(--accent); color:var(--accent-ink); border:1px solid var(--accent); border-radius:99px;
  padding:9px 18px; font:inherit; font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap}
.askgo:hover{filter:brightness(1.08)}
.askgo:focus-visible{outline:2px solid var(--glow); outline-offset:2px}
.tabtoday{margin-left:auto; align-self:center; background:var(--accent); color:var(--accent-ink);
  font-weight:700; font-size:13.5px; padding:7px 15px; border-radius:99px; text-decoration:none; margin-bottom:6px}
.tabtoday:hover{filter:brightness(1.08)}
.tabtoday:focus-visible{outline:2px solid var(--glow); outline-offset:2px}
/* board groups */
.group{margin-bottom:26px}
.ghead{display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap}
.gdot{width:12px; height:12px; border-radius:4px; flex:none}
.gname{font-family:Futura,"Avenir Next",system-ui,sans-serif; font-weight:700; font-size:17px}
.gmeta{font-size:12.5px; color:var(--muted)}
.gbar{width:120px; height:7px; background:var(--deep); border:1px solid var(--line); border-radius:99px; overflow:hidden}
.gbar>div{height:100%; width:0%; border-radius:99px}
.gpct{font-size:12px; color:var(--muted); font-weight:700; min-width:34px}
.rows{display:flex; flex-direction:column; gap:7px}
.row{background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
.rowbtn{display:grid; grid-template-columns:86px 1fr auto auto auto; gap:12px; align-items:center;
  width:100%; background:none; border:none; text-align:left; padding:12px 14px; border-left:4px solid transparent}
.rowbtn:hover{background:var(--deep)}
.rowbtn:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.rdate{font-size:12.5px; color:var(--muted); line-height:1.25}
.rdate b{display:block; color:var(--ink); font-size:14.5px}
.rtitle{font-weight:600; font-size:14.5px; text-wrap:balance}
.rpct{font-size:11.5px; font-weight:700; color:var(--accent); min-width:38px; text-align:right}
.caret{color:var(--muted); font-size:12px; transition:transform .15s}
.row.open .caret{transform:rotate(90deg)}
/* status pills — the monday language */
.st{font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
  padding:5px 12px; border-radius:8px; white-space:nowrap; text-align:center; min-width:86px}
.st.done{background:var(--accent); color:var(--accent-ink)}
.st.tonight{background:var(--glow); color:var(--accent-ink)}
.st.event{background:var(--ph-scrim); color:#fff}
.st.up{background:var(--deep); color:var(--muted); border:1px solid var(--line)}
.st.open{background:var(--deep); color:var(--muted); border:1px solid var(--line)}
.st.soon{background:var(--amber-soft); color:var(--amber); border:1px solid var(--amber)}
.st.over{background:var(--alert); color:#fff}
.st.ok{background:var(--accent); color:var(--accent-ink)}
/* expanded row */
.rbody{display:none; padding:4px 18px 18px 24px; border-top:1px solid var(--line)}
.row.open .rbody{display:grid; gap:14px}
.blab{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:700; margin:10px 0 6px}
.goals li{margin:3px 0; font-size:14px}
ul.cklist{list-style:none; padding:0; margin:0; display:grid; gap:6px}
.cklist li{display:flex; flex-wrap:wrap; align-items:center; gap:6px}
.ck{display:flex; gap:10px; align-items:flex-start; flex:1; min-width:230px; text-align:left; border:1px solid var(--line);
  border-radius:9px; padding:8px 11px; font-size:14px; color:var(--ink); background:var(--paper)}
.ck:hover{border-color:var(--accent)}
.ck:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.ck .box{flex:none; width:19px; height:19px; border:2px solid var(--accent); border-radius:6px; margin-top:1px;
  display:grid; place-items:center; font-size:12px; font-weight:900; color:var(--accent-ink)}
.ck.on .box{background:var(--accent)}
.ck.on .t{text-decoration:line-through; opacity:.6}
.mats{display:flex; flex-wrap:wrap; gap:8px}
.mats a{display:inline-flex; gap:6px; font-size:12.5px; font-weight:700; color:var(--accent);
  border:1px solid var(--line); background:var(--paper); border-radius:99px; padding:6px 13px; text-decoration:none}
.mats a:hover{border-color:var(--accent)}
.mats a.daily{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
/* paperwork rows */
.prow{display:grid; grid-template-columns:auto 86px 1fr auto; gap:12px; align-items:center;
  width:100%; background:none; border:none; text-align:left; padding:11px 14px; border-left:4px solid var(--amber)}
.prow:hover{background:var(--deep)}
.prow:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.prow .box{flex:none; width:19px; height:19px; border:2px solid var(--amber); border-radius:6px;
  display:grid; place-items:center; font-size:12px; font-weight:900; color:var(--accent-ink)}
.prow.on .box{background:var(--accent); border-color:var(--accent)}
.prow.on .pitem{text-decoration:line-through; opacity:.6}
.pitem{font-weight:600; font-size:14px}
.pnotes{font-size:12px; color:var(--muted); margin-top:2px; display:none}
.prow.show .pnotes{display:block}
/* calendar */
.cal{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px}
.month{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; box-shadow:var(--shadow)}
.mname{font-family:Futura,"Avenir Next",system-ui,sans-serif; font-weight:700; font-size:16px; margin-bottom:8px}
.dow, .days{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
.dow span{font-size:10px; font-weight:700; color:var(--muted); text-align:center; letter-spacing:.06em}
.day{min-height:38px; border-radius:8px; padding:3px 4px; font-size:11px; color:var(--muted); position:relative}
.day.in{background:var(--deep)}
.day.today{outline:2px solid var(--glow)}
.day a{display:block; margin-top:2px; font-size:9.5px; font-weight:800; letter-spacing:.02em; color:#fff;
  border-radius:5px; padding:2px 4px; text-decoration:none; text-align:center; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.day a:focus-visible{outline:2px solid var(--ink)}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin:14px 0 0; font-size:12.5px; color:var(--muted)}
.legend i{width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:5px}
/* library */
.lib{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:14px}
.libgroup{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow)}
.libgroup h3{margin:0 0 8px; font-size:15px; font-family:Futura,"Avenir Next",system-ui,sans-serif}
.libgroup ul{margin:0; padding:0; list-style:none}
.libgroup li{margin:6px 0; font-size:14px}
.libgroup a{color:var(--accent); text-decoration:none; font-weight:600}
.libgroup a:hover{text-decoration:underline}
.ft{color:var(--muted); font-size:11px; font-weight:600; letter-spacing:.05em; margin-left:6px}
/* reference chips on plan items */
.ref{display:inline-flex; align-items:center; font-size:11px; font-weight:800; color:var(--glow);
  border:1px solid var(--glow); border-radius:99px; padding:1px 9px; margin:2px 0 0 6px;
  background:var(--glow-soft); cursor:pointer; white-space:nowrap}
.ref:hover{background:var(--glow); color:var(--accent-ink)}
/* in-page PDF viewer */
.pdfview{position:fixed; inset:0; z-index:60; background:rgba(10,16,12,.55); display:flex;
  align-items:stretch; justify-content:center; padding:2.5vh 2.5vw}
.pdfview[hidden]{display:none}
.pvbox{display:flex; flex-direction:column; width:min(1000px,100%); background:var(--card);
  border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:var(--shadow)}
.pvhead{display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid var(--line)}
.pvhead b{font-size:14px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pvhead .mono{font-size:12px; color:var(--muted)}
.pvhead a{font-size:12.5px; font-weight:700; text-decoration:none; color:var(--accent)}
.pvhead button{background:var(--deep); border:1px solid var(--line); border-radius:8px; padding:6px 12px; font-weight:700; font-size:13px}
.pvhead button:hover{border-color:var(--accent); color:var(--accent)}
.pvhead button:focus-visible, .ref:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.pvbox iframe{flex:1; width:100%; border:0; background:#525659}
footer{margin-top:52px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px}
.view{display:none}
.view.on{display:block}
@media (max-width:640px){
  .rowbtn{grid-template-columns:70px 1fr auto; }
  .rowbtn .rpct, .rowbtn .caret{display:none}
  .prow{grid-template-columns:auto 70px 1fr}
  .prow .st{grid-column:2 / -1; justify-self:start; margin-top:2px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow">White Lake Robotics · FIRST LEGO League Challenge · BioGlow</div>
    <img class="biglogo" src="assets/brand/barracoder-logo-web.png" alt="Barracoder">
    <h1 class="visually-hidden">Barracoder Season Board</h1>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab on" role="tab" data-v="board" aria-selected="true">Board</button>
    <button class="tab" role="tab" data-v="cal" aria-selected="false">Calendar</button>
    <button class="tab" role="tab" data-v="lib" aria-selected="false">Library</button>
    <a class="tabtoday" href="meeting.html">✨ Today</a>
  </div>

  <form class="askbar" id="askbar" hidden>
    <input id="askq" type="text" autocomplete="off"
           placeholder="Ask about the season — “when is the paperwork due?”">
    <button type="submit" class="askgo">Ask</button>
  </form>

  <div class="view on" id="v-board"></div>
  <div class="view" id="v-cal"><div class="cal" id="calgrid"></div>
    <div class="legend" id="callegend"></div></div>
  <div class="view" id="v-lib"><div class="lib" id="libgrid"></div></div>

  <footer>Barracoder · FIRST LEGO League Challenge · BioGlow season · materials © FIRST &amp; the LEGO Group ·
    <a href="https://github.com/mirzaaamerali/barracoder">GitHub repo</a> ·
    <a href="https://github.com/mirzaaamerali/barracoder/tree/main/notes">notes</a> ·
    <a href="https://github.com/mirzaaamerali/barracoder/blob/main/SCHEDULE.md">printable schedule</a></footer>
</div>

<div class="pdfview" id="pdfview" hidden role="dialog" aria-modal="true" aria-label="Document viewer">
  <div class="pvbox">
    <div class="pvhead"><b id="pvtitle"></b><span class="mono" id="pvpage"></span>
      <a id="pvnew" target="_blank" rel="noopener">Open in tab ↗</a>
      <button id="pvclose" type="button">✕ Close</button></div>
    <iframe id="pvframe" title="Document"></iframe>
  </div>
</div>

<script src="assets/ai-config.js"></script>
<script src="assets/ai.js"></script>
<script>
/* Assistant wiring — hidden entirely until the Worker endpoint is configured. */
(function () {
  var ep = window.BARRACODER_AI_ENDPOINT;
  if (!ep || !window.BarracoderAI) return;
  BarracoderAI.configure({ endpoint: ep });
  var bar = document.getElementById('askbar');
  bar.hidden = false;
  bar.addEventListener('submit', function (e) {
    e.preventDefault();
    var q = document.getElementById('askq').value.trim();
    if (!q) return;
    /* Only the question goes over the wire — the Worker builds the season
       context itself from meetings.json, so this can't be used to smuggle in
       an arbitrary prompt. */
    BarracoderAI.panel({
      title: 'About the season',
      intro: 'Answered from the season plan on this site.',
      task: 'ask',
      input: { question: q }
    });
  });
})();
</script>

<script>
const $ = s => document.querySelector(s);
const LS = k => { try { return JSON.parse(localStorage.getItem('bar:' + k) || '[]'); } catch(e){ return []; } };
const setLS = (k, v) => localStorage.setItem('bar:' + k, JSON.stringify(v));
const todayIso = () => { const n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0'); };
const MN = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PHCOLOR = {'Core sessions':'--ph-core','Event prep':'--ph-prep','Scrimmage':'--ph-scrim',
  'Improve for the main event':'--ph-improve','Wrap-up':'--ph-wrap'};
let DATA = null;

fetch('meetings.json').then(r => r.json()).then(d => { DATA = d; render(); })
  .catch(() => { $('#v-board').textContent = 'Could not load meetings.json — refresh to retry.'; });

/* in-page PDF viewer */
let pvReturn = null;
function openPdf(href, page, title) {
  pvReturn = document.activeElement;
  $('#pvtitle').textContent = title || href.split('/').pop();
  $('#pvpage').textContent = page ? 'p.' + page : '';
  $('#pvnew').href = href + (page ? '#page=' + page : '');
  $('#pvframe').src = href + (page ? '#page=' + page : '');
  $('#pdfview').hidden = false;
  document.body.style.overflow = 'hidden';
  $('#pvclose').focus();
}
function closePdf() {
  $('#pdfview').hidden = true;
  $('#pvframe').src = 'about:blank';
  document.body.style.overflow = '';
  if (pvReturn) pvReturn.focus();
}
document.getElementById('pvclose').onclick = closePdf;
document.getElementById('pdfview').addEventListener('click', e => { if (e.target.id === 'pdfview') closePdf(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#pdfview').hidden) closePdf(); });
const isPdf = href => /\.pdf$/i.test(href) && !/^https?:/i.test(href);

/* tabs */
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => { x.classList.remove('on'); x.setAttribute('aria-selected','false'); });
  document.querySelectorAll('.view').forEach(x => x.classList.remove('on'));
  t.classList.add('on'); t.setAttribute('aria-selected','true');
  $('#v-' + t.dataset.v).classList.add('on');
  localStorage.setItem('bar:tab', t.dataset.v);
});
const savedTab = localStorage.getItem('bar:tab');
if (savedTab && document.querySelector('.tab[data-v="' + savedTab + '"]'))
  document.querySelector('.tab[data-v="' + savedTab + '"]').click();

function meetingStatus(m, iso) {
  if (m.date === iso) return m.kind === 'event' ? ['event','✨ Today'] : ['tonight','Tonight'];
  if (m.date < iso) return ['done','Done'];
  if (m.kind === 'event') return ['event','Event'];
  return ['up','Upcoming'];
}
function planPct(m) {
  const t = m.activities.length; if (!t) return null;
  return Math.round(100 * Math.min(LS(m.date + ':plan').length, t) / t);
}

function render() {
  renderBoard(); renderTiles(); renderCal(); renderLib();
}

function renderTiles() { /* header tiles removed by request — hook kept for checklist callbacks */ }

function renderBoard() {
  const iso = todayIso();
  const wrap = $('#v-board'); wrap.innerHTML = '';
  const phases = [];
  DATA.meetings.forEach(m => {
    let ph = phases.find(p => p.name === m.phase);
    if (!ph) { ph = {name: m.phase, items: []}; phases.push(ph); }
    ph.items.push(m);
  });
  phases.forEach(ph => {
    const color = 'var(' + (PHCOLOR[ph.name] || '--accent') + ')';
    let T = 0, D = 0;
    ph.items.forEach(m => { T += m.activities.length; D += Math.min(LS(m.date + ':plan').length, m.activities.length); });
    const pct = T ? Math.round(100 * D / T) : 0;
    const g = document.createElement('section'); g.className = 'group';
    const from = ph.items[0].date.slice(5).replace('-','/'), to = ph.items[ph.items.length-1].date.slice(5).replace('-','/');
    g.innerHTML = '<div class="ghead"><span class="gdot" style="background:' + color + '"></span>' +
      '<span class="gname"></span><span class="gmeta">' + from + ' – ' + to + ' · ' + ph.items.length +
      (ph.items.length > 1 ? ' meetings' : ' event') + '</span>' +
      '<span class="gbar"><div style="width:' + pct + '%; background:' + color + '"></div></span>' +
      '<span class="gpct">' + pct + '%</span></div>';
    g.querySelector('.gname').textContent = ph.name;
    const rows = document.createElement('div'); rows.className = 'rows';
    ph.items.forEach(m => rows.appendChild(row(m, iso, color)));
    g.appendChild(rows);
    wrap.appendChild(g);
  });
  // paperwork group
  const g = document.createElement('section'); g.className = 'group';
  g.innerHTML = '<div class="ghead"><span class="gdot" style="background:var(--amber)"></span>' +
    '<span class="gname">Paperwork &amp; documents</span><span class="gmeta">everything due by Oct 31 · tap a row for details</span></div>';
  const rows = document.createElement('div'); rows.className = 'rows';
  (DATA.paperwork || []).forEach((p, i) => rows.appendChild(prow(p, i, iso)));
  g.appendChild(rows);
  wrap.appendChild(g);
}

function row(m, iso, color) {
  const r = document.createElement('div'); r.className = 'row';
  const [st, lab] = meetingStatus(m, iso);
  const pct = planPct(m);
  const b = document.createElement('button'); b.className = 'rowbtn'; b.style.borderLeftColor = color;
  b.setAttribute('aria-expanded', 'false');
  const [y,mo,da] = m.date.split('-');
  b.innerHTML = '<span class="rdate">' + m.day + '<b>' + MN[+mo] + ' ' + (+da) + '</b></span>' +
    '<span class="rtitle"></span>' +
    '<span class="rpct">' + (pct ? pct + '%' : '') + '</span>' +
    '<span class="st ' + st + '">' + lab + '</span><span class="caret">▶</span>';
  b.querySelector('.rtitle').textContent = m.title;
  b.onclick = () => { const open = r.classList.toggle('open'); b.setAttribute('aria-expanded', open);
    if (open && !r.querySelector('.rbody').dataset.built) buildBody(r, m); };
  r.appendChild(b);
  const body = document.createElement('div'); body.className = 'rbody'; r.appendChild(body);
  return r;
}

function buildBody(r, m) {
  const body = r.querySelector('.rbody'); body.dataset.built = '1';
  let h = '';
  if (m.goals.length) h += '<div><div class="blab">Goals</div><ul class="goals">' +
    m.goals.map(g => '<li></li>').join('') + '</ul></div>';
  h += '<div><div class="blab">Plan · 90 min — tick as you go · tap a page chip to open the doc</div><ul class="cklist" data-key="' + m.date + ':plan"></ul></div>';
  if ((m.deliverables || []).length) h += '<div><div class="blab">Done when</div><ul class="cklist" data-key="' + m.date + ':done"></ul></div>';
  h += '<div><div class="blab">Materials</div><div class="mats"><a class="daily" href="meeting.html?date=' + m.date + '">✨ Daily page</a></div></div>';
  body.innerHTML = h;
  body.querySelectorAll('.goals li').forEach((li, i) => li.textContent = m.goals[i]);
  buildCk(body.querySelector('[data-key="' + m.date + ':plan"]'), m.activities, m.date + ':plan', m.activity_refs);
  const dn = body.querySelector('[data-key="' + m.date + ':done"]');
  if (dn) buildCk(dn, m.deliverables, m.date + ':done');
  const mats = body.querySelector('.mats');
  (m.materials || []).forEach(x => {
    const a = document.createElement('a'); a.href = x.href; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = '📄 ' + x.label;
    if (isPdf(x.href)) a.onclick = e => { e.preventDefault(); openPdf(x.href, null, x.label); };
    mats.appendChild(a);
  });
}

function buildCk(ul, items, key, refs) {
  items.forEach((t, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'ck' + (LS(key).includes(i) ? ' on' : '');
    b.innerHTML = '<span class="box">' + (LS(key).includes(i) ? '✓' : '') + '</span><span class="t"></span>';
    b.querySelector('.t').textContent = t;
    const rlist = (refs && refs[i]) || [];
    b.onclick = () => {
      const s = LS(key), on = s.includes(i);
      setLS(key, on ? s.filter(x => x !== i) : s.concat([i]));
      b.classList.toggle('on', !on);
      b.querySelector('.box').textContent = on ? '' : '✓';
      renderTiles(); refreshGroupBars();
    };
    li.appendChild(b);
    rlist.forEach(r => {
      const c = document.createElement('button'); c.type = 'button'; c.className = 'ref';
      c.textContent = '📖 ' + r.label;
      c.onclick = () => openPdf(r.href, r.page, r.label);
      li.appendChild(c);
    });
    ul.appendChild(li);
  });
}
function refreshGroupBars() {
  // cheap: re-render board headers only via full board rebuild is disruptive; update bars in place
  document.querySelectorAll('#v-board .group').forEach(g => {
    const name = g.querySelector('.gname').textContent;
    const items = DATA.meetings.filter(m => m.phase === name);
    if (!items.length) return;
    let T = 0, D = 0;
    items.forEach(m => { T += m.activities.length; D += Math.min(LS(m.date + ':plan').length, m.activities.length); });
    const pct = T ? Math.round(100 * D / T) : 0;
    const bar = g.querySelector('.gbar>div'), lab = g.querySelector('.gpct');
    if (bar) bar.style.width = pct + '%';
    if (lab) lab.textContent = pct + '%';
  });
}

function prow(p, i, iso) {
  const r = document.createElement('div'); r.className = 'row';
  const done = LS('paperwork').includes(i);
  const soon = new Date(p.due + 'T00:00:00') - new Date() < 7 * 86400000;
  const over = p.due < iso;
  const st = done ? ['ok','Done'] : over ? ['over','Overdue'] : soon ? ['soon','Due soon'] : ['open','Open'];
  const [y,mo,da] = p.due.split('-');
  const b = document.createElement('button'); b.className = 'prow' + (done ? ' on' : '');
  b.innerHTML = '<span class="box">' + (done ? '✓' : '') + '</span>' +
    '<span class="rdate">due<b>' + MN[+mo] + ' ' + (+da) + '</b></span>' +
    '<span><span class="pitem"></span><span class="pnotes"></span></span>' +
    '<span class="st ' + st[0] + '">' + st[1] + '</span>';
  b.querySelector('.pitem').textContent = p.item;
  b.querySelector('.pnotes').textContent = p.notes;
  b.onclick = e => {
    if (e.detail === 0 || e.target.closest('.box')) { togglePaper(b, i); return; }
    if (b.classList.contains('show') || e.target.closest('.pitem,.pnotes')) b.classList.toggle('show');
    else togglePaper(b, i);
  };
  r.appendChild(b);
  return r;
}
function togglePaper(b, i) {
  const s = LS('paperwork'), on = s.includes(i);
  setLS('paperwork', on ? s.filter(x => x !== i) : s.concat([i]));
  b.classList.toggle('on', !on);
  b.querySelector('.box').textContent = on ? '' : '✓';
  const st = b.querySelector('.st');
  renderTiles();
  // recompute pill
  const p = DATA.paperwork[i]; const iso = todayIso();
  const done = !on;
  const soon = new Date(p.due + 'T00:00:00') - new Date() < 7 * 86400000;
  const over = p.due < iso;
  const v = done ? ['ok','Done'] : over ? ['over','Overdue'] : soon ? ['soon','Due soon'] : ['open','Open'];
  st.className = 'st ' + v[0]; st.textContent = v[1];
}

/* calendar */
function renderCal() {
  const grid = $('#calgrid'); grid.innerHTML = '';
  const iso = todayIso();
  const byDate = {};
  DATA.meetings.forEach(m => byDate[m.date] = m);
  const months = [[2026,8],[2026,9],[2026,10],[2026,11],[2026,12]];
  months.forEach(([y, mo]) => {
    const first = new Date(y, mo-1, 1);
    const dim = new Date(y, mo, 0).getDate();
    const lead = first.getDay();
    const box = document.createElement('div'); box.className = 'month';
    box.innerHTML = '<div class="mname">' + MN[mo] + ' ' + y + '</div>' +
      '<div class="dow"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>';
    const days = document.createElement('div'); days.className = 'days';
    for (let i = 0; i < lead; i++) days.appendChild(document.createElement('div'));
    for (let d = 1; d <= dim; d++) {
      const dt = y + '-' + String(mo).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      const cell = document.createElement('div');
      cell.className = 'day in' + (dt === iso ? ' today' : '');
      cell.textContent = d;
      const m = byDate[dt];
      if (m) {
        const a = document.createElement('a');
        a.href = 'meeting.html?date=' + dt;
        a.style.background = 'var(' + (PHCOLOR[m.phase] || '--accent') + ')';
        a.textContent = m.kind === 'event' ? '✨ SCRIM' : m.title.replace(/^Session (\d+).*/, 'S$1').slice(0, 9);
        a.title = m.title;
        cell.appendChild(a);
      }
      if (dt === '2026-10-31') {
        const a = document.createElement('a');
        a.style.background = 'var(--amber)'; a.href = '#'; a.onclick = e => e.preventDefault();
        a.textContent = '📋 DOCS'; a.title = 'All paperwork due';
        cell.appendChild(a);
      }
      days.appendChild(cell);
    }
    box.appendChild(days);
    grid.appendChild(box);
  });
  const leg = $('#callegend'); leg.innerHTML = '';
  Object.entries(PHCOLOR).forEach(([name, v]) => {
    const s = document.createElement('span');
    s.innerHTML = '<i style="background:var(' + v + ')"></i>';
    s.appendChild(document.createTextNode(name));
    leg.appendChild(s);
  });
}

function renderLib() {
  const grid = $('#libgrid'); grid.innerHTML = '';
  LIBGROUPS.forEach(([name, items]) => {
    const g = document.createElement('div'); g.className = 'libgroup';
    g.innerHTML = '<h3></h3><ul></ul>';
    g.querySelector('h3').textContent = name;
    const ul = g.querySelector('ul');
    items.forEach(([label, href, tag]) => {
      const li = document.createElement('li');
      const a = document.createElement('a'); a.href = href; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = label;
      if (tag === 'PDF') a.onclick = e => { e.preventDefault(); openPdf(href, null, label); };
      li.appendChild(a);
      const s = document.createElement('span'); s.className = 'ft';
      s.textContent = tag === 'PDF' ? 'PDF · opens in browser' : tag === 'PPTX' ? 'PPTX · downloads' : tag === 'DL' ? 'downloads · open in SPIKE app' : tag === 'YT' ? 'YouTube' : tag === 'MP4' ? 'MP4 · 1.4 GB download' : 'on GitHub';
      li.appendChild(s);
      ul.appendChild(li);
    });
    grid.appendChild(g);
  });
