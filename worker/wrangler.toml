name = "barracoder-ai"
main = "index.js"
compatibility_date = "2026-08-01"
workers_dev = true

# Secrets are NOT stored here. Set them once with:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put TEAM_PASSCODE

# ---------------------------------------------------------------------------
# REQUIRED: KV namespace backing the request quotas AND the monthly spend
# counter. This is not optional. The Worker fails CLOSED without it — if the
# RATE binding is missing, /v1/assist returns 503 server_misconfigured for
# every request and logs a config error. A missing quota store must never mean
# "no limits": this key shares a $10/month org spend cap with a real business's
# production keys.
#
# Create it and paste the returned id below:
#   npx wrangler kv namespace create RATE
#
# The placeholder id is intentionally left in place so that `wrangler deploy`
# fails loudly until it is replaced. Do not comment this block out.
[[kv_namespaces]]
binding = "RATE"
id = "PASTE_NAMESPACE_ID_HERE"

# ---------------------------------------------------------------------------
# REQUIRED: Cloudflare's native rate limiting bindings, used as burst /
# concurrency brakes. KV read-modify-write suffers lost updates under
# concurrency (100 simultaneous requests all read N and write N+1), so these
# atomic, free limiters throttle bursts before the KV counters are touched.
# The Worker fails CLOSED without either one, same as the KV namespace above.
#
# BOTH blocks are required, and they do different jobs:
#
#   BURST        is per IP. It stops one device hammering the endpoint — but it
#                CANNOT serialise anything, because 100 requests from 100
#                different addresses all pass it simultaneously.
#   BURST_GLOBAL is keyed on a constant, so it is site-wide. This is the one
#                that actually caps how many requests can ever be in flight at
#                once, and therefore the one that keeps the KV counters from
#                losing updates. 10 requests/minute site-wide is ample for a
#                team of coaches.
#
# namespace_id is a local identifier you choose; it does not need to be created
# anywhere first.
[[ratelimits]]
name = "BURST"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "BURST_GLOBAL"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
